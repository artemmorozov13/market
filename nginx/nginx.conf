events {
    worker_connections 1024;
}

http {
    # HTTP → HTTPS редирект
    server {
        listen 80;
        server_name akacuki.ru www.akacuki.ru;
        return 301 https://$host$request_uri;
    }

    # Основной HTTPS сервер
    server {
        listen 443 ssl;
        server_name akacuki.ru www.akacuki.ru;

        # Пути к сертификатам
        ssl_certificate /etc/nginx/certificates/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificates/privkey.pem;
        
        # Настройки SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        # Admin фронтенд
        location /admin {
            proxy_pass http://admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # App фронтенд
        location /app {
            proxy_pass http://app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API
        location /api {
            proxy_pass http://backend:9000/api;
            
            # Основные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Важно для API:
            proxy_set_header Accept application/json;
            proxy_set_header Content-Type application/json;
            
            # Отключаем буферизацию для streaming JSON
            proxy_buffering off;
            
            # Увеличиваем таймауты для API
            proxy_connect_timeout 75s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            # Отключаем преобразование ответов
            proxy_redirect off;
        }

        location /store/create/ {
            proxy_pass http://landing/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Для SPA:
            proxy_intercept_errors on;
            error_page 404 = /store/create/index.html;
        }

        location = /store/create {
            return 301 /store/create/;
        }
        
        # Корень
        location / {
            return 301 /app;
        }

        # Ошибки
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}