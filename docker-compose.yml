version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      - PORT=8000
      - DB_HOST=${DB_HOST}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    env_file:
      - ./.env
    expose:
      - "8000"  # Только для внутренней сети Docker

  admin:
    build:
      context: ./admin
    env_file:
      - ./.env
    expose:
      - "80"  # Frontend на 80 порту внутри контейнера

  app:
    build:
      context: ./app
    env_file:
      - ./.env
    expose:
      - "80"  # Frontend на 80 порту внутри контейнера

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certificates:/etc/nginx/certificates:ro
    depends_on:
      - backend
      - admin
      - app
    restart: unless-stopped

volumes:
  postgres_data: