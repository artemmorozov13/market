version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    env_file:
      - ./.env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      - NODE_ENV=development
    env_file:
      - ./.env.dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    command: ["/wait-for-it.sh", "postgres:5432", "--", "npm", "run", "start:dev"]

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./admin:/app
      - /app/node_modules
    ports:
      - "3001:3001"

  app:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./app:/app
      - /app/node_modules
    ports:
      - "3002:3002"

volumes:
  postgres_data: