version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ../nginx/nginx-dev.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - admin
      - app

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    env_file:
      - ../.env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ../
      dockerfile: docker/backend.dev.Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=9000
    env_file:
      - ../.env.dev
    ports:
      - "9000:9000"
    volumes:
      - ../apps/backend:/app
      - ../shared/dist:/app/shared
      - /app/node_modules
    depends_on:
      - postgres

  admin:
    build:
      context: ../
      dockerfile: docker/admin.dev.Dockerfile
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ../.env.dev
    volumes:
      - ../apps/admin:/app
      - /app/node_modules
      - ../shared/dist:/app/shared
    ports:
      - "3001:3001"

  app:
    build:
      context: ../
      dockerfile: docker/app.dev.Dockerfile
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ../.env.dev
    volumes:
      - ../apps/app:/app
      - /app/node_modules
      - ../shared/dist:/app/shared
    ports:
      - "3002:3002"
    
  landing:
    build:
      context: ../
      dockerfile: docker/landing.dev.Dockerfile
    volumes:
      - ../apps/landing:/usr/share/nginx/html
      - ../nginx/landing-dev.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "3004:80"

volumes:
  postgres_data: